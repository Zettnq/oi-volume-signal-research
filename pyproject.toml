[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oivdc-research"
version = "0.1.1"
description = "Open interest / volume-delta exhaustion-reversal research on crypto perpetuals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zettnq", email = "zettnq@gmail.com" },
]
keywords = [
    "open interest", "volume delta", "crypto", "perpetual futures",
    "market microstructure", "event study", "quantitative finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyarrow>=14",
    "ccxt>=4.0",
]

[project.urls]
Repository = "https://github.com/zettnq/oi-volume-signal-research"
Homepage = "https://substack.com/@iceninetrading"

[tool.setuptools.packages.find]
where = ["src"]